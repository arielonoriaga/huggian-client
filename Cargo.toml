[package]
name = "huggian-client"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Shared client + webhook primitives for huggian-core integrations."
repository = "git@personal:arielonoriaga/huggian-client.git"

[features]
default = ["webhook"]
# Pure sync crypto, zero extra dependencies — safe as every consumer's default.
webhook = []
# Pulls in an HTTP client + async runtime bits. Opt-in only: huggian-client
# has more than one consumer (ez-commerce depends on `webhook` alone today),
# and nobody should silently inherit a bigger build + attack surface for a
# capability they never asked for.
products = ["dep:reqwest", "dep:tokio", "dep:serde", "dep:serde_json", "dep:uuid"]
# The huggian AI gateway's retrying, circuit-breaking HTTP client — ported
# from ez-addon's `infrastructure::ai_gateway::huggian` module so every
# consumer of huggian's AI gateway shares one tuned implementation instead
# of hand-rolling its own. Only the wire client + error taxonomy moves here;
# a consumer's own provider-abstraction trait and env-var resolution stay
# in that consumer's own code.
ai-gateway = ["dep:reqwest", "dep:tokio", "dep:serde", "dep:serde_json", "dep:rand", "dep:thiserror"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
uuid = { version = "1", features = ["serde"], optional = true }
rand = { version = "0.8", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
wiremock = "0.6"
serde_json = "1"
