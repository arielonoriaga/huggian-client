[package]
name = "huggian-client"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Shared client + webhook primitives for huggian-core integrations."
repository = "git@personal:arielonoriaga/huggian-client.git"

[features]
default = ["webhook"]
# Pure sync crypto, zero extra dependencies — safe as every consumer's default.
webhook = []
# Pulls in an HTTP client + async runtime bits. Opt-in only: huggian-client
# has more than one consumer (ez-commerce depends on `webhook` alone today),
# and nobody should silently inherit a bigger build + attack surface for a
# capability they never asked for.
products = ["dep:reqwest", "dep:tokio", "dep:serde", "dep:serde_json", "dep:uuid"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
uuid = { version = "1", features = ["serde"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
serde_json = "1"
